<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINE Top1000 갤러리</title><style>body{margin:0;font-family:system-ui}#msg{padding:30px}iframe{width:100%;height:100dvh;border:0;display:block}</style><div id="msg">갤러리를 불러오는 중입니다. 잠시 기다려 주세요.</div><script>(async()=>{try{const parts=await Promise.all(["top1000-0.part","top1000-1.part","top1000-2.part","top1000-3.part","top1000-4.part","top1000-5.part","top1000-6.part","top1000-7.part","top1000-8.part","top1000-9.part","top1000-10.part","top1000-11.part"].map(async u=>{const r=await fetch(u);if(!r.ok)throw Error(r.status);return r.arrayBuffer()}));const h=await new Blob(parts,{type:'text/html'}).text();document.getElementById('msg').remove();const f=document.createElement('iframe');f.title='스티커 갤러리';f.srcdoc=h;document.body.appendChild(f)}catch(e){document.getElementById('msg').textContent='갤러리 로딩 실패. 새로고침해 주세요.'}})();</script></html>
