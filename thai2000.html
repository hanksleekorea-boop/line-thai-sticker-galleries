<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>태국어 스티커 2000개 갤러리</title><style>body{margin:0;font-family:system-ui}#msg{padding:30px}iframe{width:100%;height:100dvh;border:0;display:block}</style><div id="msg">갤러리를 불러오는 중입니다. 잠시 기다려 주세요.</div><script>(async()=>{try{const parts=await Promise.all(["thai2000-0.part","thai2000-1.part","thai2000-2.part","thai2000-3.part","thai2000-4.part","thai2000-5.part","thai2000-6.part","thai2000-7.part","thai2000-8.part","thai2000-9.part","thai2000-10.part","thai2000-11.part"].map(async u=>{const r=await fetch(u);if(!r.ok)throw Error(r.status);return r.arrayBuffer()}));const h=await new Blob(parts,{type:'text/html'}).text();document.getElementById('msg').remove();const f=document.createElement('iframe');f.title='스티커 갤러리';f.srcdoc=h;document.body.appendChild(f)}catch(e){document.getElementById('msg').textContent='갤러리 로딩 실패. 새로고침해 주세요.'}})();</script></html>
